    ctx.restore(); ctx.restore();
  }

  const scanP = clamp(p / 0.55, 0, 1);
  const scanX = -w*0.62 + (w*1.24) * scanP;
  if(scanP > 0 && scanP < 1){
    ctx.save();
    const lg = ctx.createLinearGradient(scanX, -h*1.1, scanX, h*0.6);
    lg.addColorStop(0, 'rgba(34,211,238,0)');
    lg.addColorStop(0.45, 'rgba(120,250,255,0.95)');
    lg.addColorStop(1, 'rgba(34,211,238,0)');
    ctx.strokeStyle = lg; ctx.lineWidth = 3;
    ctx.shadowColor = '#22d3ee'; ctx.shadowBlur = 28;
    ctx.beginPath(); ctx.moveTo(scanX, -h*1.1); ctx.lineTo(scanX, h*0.6); ctx.stroke();
    ctx.restore();
    for(let i=0;i<3;i++){
      const yy = -h*0.6 + i*h*0.28;
      const a = 0.25 + 0.55*Math.abs(Math.sin(t*7 + i));
      ctx.save();
      ctx.globalAlpha = a;
      ctx.fillStyle = '#a5f3fc';
      ctx.shadowColor = '#22d3ee'; ctx.shadowBlur = 16;
      ctx.beginPath(); ctx.arc(scanX, yy, 4, 0, Math.PI*2); ctx.fill();
      ctx.restore();
    }
  }

  const checks = [
    {x:-0.30*w, y:-0.62*h, t:0.18, label:'КУЗОВ'},
    {x: 0.05*w, y:-0.70*h, t:0.32, label:'СТЁКЛА'},
    {x: 0.42*w, y:-0.34*h, t:0.46, label:'ЭЛЕКТРОНИКА'},
    {x:-0.10*w, y:-0.02*h, t:0.60, label:'ХОДОВАЯ'},
    {x: 0.48*w, y: 0.10*h, t:0.72, label:'ТОРМОЗА'},
  ];
  for(const c of checks){
    const a = clamp((p - c.t) / 0.10, 0, 1);
    if(a <= 0) continue;
    const s = easeOutBack(a);
    ctx.save();
    ctx.translate(c.x, c.y);
    ctx.scale(s, s);
    ctx.globalAlpha = clamp(a*1.5, 0, 1);
    ctx.beginPath(); ctx.arc(0, 0, 20, 0, Math.PI*2);
    ctx.fillStyle = 'rgba(34,211,238,0.18)'; ctx.fill();
    ctx.strokeStyle = '#22d3ee'; ctx.lineWidth = 2.5;
    ctx.shadowColor = '#22d3ee'; ctx.shadowBlur = 18;
    ctx.stroke(); ctx.shadowBlur = 0;
    ctx.beginPath();
    ctx.moveTo(-8, 0); ctx.lineTo(-2, 7); ctx.lineTo(9, -7);
    ctx.strokeStyle = '#a5f3fc'; ctx.lineWidth = 3.5;
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.stroke();
    ctx.globalAlpha = clamp((a-0.4)/0.6, 0, 1) * 0.85;
    ctx.fillStyle = '#a5f3fc';
    ctx.font = '600 11px "Segoe UI", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(c.label, 0, 42);
    ctx.restore();
  }
  drawGround(t, '#22d3ee', 0.21*h + 6);
  ctx.restore();
}

/* ═══════════════════════════════════════════════════════════
   ЭТАП 8 — ГОТОВЫЙ АВТОМОБИЛЬ
═══════════════════════════════════════════════════════════ */
function stageFinal(t, p){
  ctx.save();
  setupWorld(); ctx.translate(0, 30);
  const w = 620, h = 258;
  const path = makeCarPath(w, h);
  const drive = easeOutCubic(clamp(p / 0.28, 0, 1));
  const carX = lerp(-1.4 * w, 0, drive);
  const wheelRot = t * 9 * (1 - drive * 0.85);

  ctx.save();
  ctx.translate(carX, 0);

  ctx.save();
  ctx.globalAlpha = 0.35; ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.ellipse(0, 0.24*h, w*0.52, 16, 0, 0, Math.PI*2); ctx.fill();
  ctx.restore();

  const bg = ctx.createLinearGradient(0, -h*0.7, 0, 0);
  bg.addColorStop(0, '#ffe9a8'); bg.addColorStop(0.35, '#fbbf24');
  bg.addColorStop(0.72, '#f59e0b'); bg.addColorStop(1, '#b45309');
  ctx.fillStyle = bg; ctx.fill(path);
  ctx.strokeStyle = 'rgba(255,245,200,0.8)'; ctx.lineWidth = 2.5;
  ctx.shadowColor = '#fbbf24'; ctx.shadowBlur = 26;
  ctx.stroke(path); ctx.shadowBlur = 0;

  ctx.save();
  ctx.globalAlpha = 0.45;
  const hg = ctx.createLinearGradient(-w*0.25, -h*0.7, 0.15*w, 0);
  hg.addColorStop(0, 'rgba(255,255,255,0.95)'); hg.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = hg; ctx.fill(path);
  ctx.restore();

  ctx.save();
  const wg = ctx.createLinearGradient(0, -h*0.6, 0, -h*0.32);
  wg.addColorStop(0, 'rgba(170,230,255,0.85)'); wg.addColorStop(1, 'rgba(45,110,160,0.7)');
  ctx.fillStyle = wg;
  ctx.strokeStyle = 'rgba(255,255,255,0.6)'; ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(-0.145*w, -0.575*h); ctx.lineTo(-0.055*w, -0.575*h);
  ctx.lineTo(-0.055*w, -0.325*h); ctx.lineTo(-0.29*w, -0.325*h);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(0.075*w, -0.575*h); ctx.lineTo(0.135*w, -0.545*h);
  ctx.lineTo(0.30*w, -0.335*h); ctx.lineTo(0.075*w, -0.335*h);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.restore();

  ctx.save();
  ctx.fillStyle = '#ffffff';
  ctx.shadowColor = '#fff8dc'; ctx.shadowBlur = 34;
  ctx.beginPath(); ctx.ellipse(-0.475*w, -0.185*h, 0.028*w, 0.028*h, 0, 0, Math.PI*2); ctx.fill();
  ctx.restore();
  ctx.save();
  ctx.fillStyle = '#ff5555';
  ctx.shadowColor = '#ff5555'; ctx.shadowBlur = 26;
  ctx.beginPath(); ctx.ellipse(0.475*w, -0.185*h, 0.022*w, 0.026*h, 0, 0, Math.PI*2); ctx.fill();
  ctx.restore();

  const r = 0.19*h;
  for(const x of [-0.295*w, 0.315*w]){
    ctx.save();
    ctx.translate(x, 0.02*h);
    const tg = ctx.createRadialGradient(-r*0.3,-r*0.3, r*0.2, 0,0, r);
    tg.addColorStop(0,'#1a1d22'); tg.addColorStop(1,'#08090b');
    ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2); ctx.fillStyle = tg; ctx.fill();
    ctx.save(); ctx.rotate(wheelRot);
    ctx.beginPath(); ctx.arc(0,0, r*0.62, 0, Math.PI*2);
    ctx.fillStyle = '#e8edf5'; ctx.fill();
    ctx.fillStyle = 'rgba(130,138,150,0.95)';
    for(let s=0;s<5;s++){
      ctx.save(); ctx.rotate(s*Math.PI*2/5);
      ctx.beginPath(); ctx.roundRect(-r*0.075, -r*0.56, r*0.15, r*0.42, r*0.05); ctx.fill();
      ctx.restore();
    }
    ctx.beginPath(); ctx.arc(0,0,r*0.19,0,Math.PI*2);
    ctx.fillStyle='#8b95a5'; ctx.fill();
    ctx.restore(); ctx.restore();
  }
  ctx.restore();

  drawGround(t, '#fbbf24', 0.21*h + 6);

  const ta = clamp((p - 0.34) / 0.16, 0, 1);
  if(ta > 0){
    ctx.save();
    ctx.globalAlpha = ta;
    ctx.textAlign = 'center';
    ctx.font = '800 46px "Segoe UI", sans-serif';
    ctx.fillStyle = '#fff';
    ctx.shadowColor = '#fbbf24'; ctx.shadowBlur = 40;
    ctx.fillText('ГОТОВО', 0, -h*0.85 - (1-ta)*30);
    ctx.shadowBlur = 0;
    ctx.font = '500 15px "Segoe UI", sans-serif';
    ctx.fillStyle = 'rgba(255,240,200,0.65)';
    ctx.fillText('АВТОМОБИЛЬ ПРОШЁЛ ВСЕ ЭТАПЫ ПРОИЗВОДСТВА', 0, -h*0.85 + 34);
    ctx.restore();
  }
  ctx.restore();

  if(p > 0.36){
    const confettiT = (p - 0.36) / 0.64;
    const cols = ['#fbbf24','#f472b6','#22d3ee','#7ee787','#a78bfa','#fb923c'];
    for(let i=0;i<90;i++){
      const seed = i * 137.508;
      const xBase = (Math.sin(seed) * 0.5 + 0.5) * W;
      const speed = 120 + (i % 9) * 42;
      const y = ((t * speed + i * 83) % (H + 240)) - 120;
      const sway = Math.sin(t*2.4 + i) * 26;
      const size = 4 + (i % 5) * 2.2;
      ctx.save();
      ctx.globalAlpha = 0.85 * Math.min(1, confettiT * 3);
      ctx.translate(xBase + sway, y);
      ctx.rotate(t * (1.6 + (i%4)*0.6) + i);
      ctx.fillStyle = cols[i % cols.length];
      ctx.fillRect(-size/2, -size/2, size, size*0.6);
      ctx.restore();
    }
  }
}

/* ═══════════════════════════════════════════════════════════
   АНИМАЦИЯ 2 — НОЧНАЯ ЕЗДА
═══════════════════════════════════════════════════════════ */
function seededRand(x, y){
  const n = Math.sin(x * 12.9898 + y * 78.233) * 43758.5453;
  return n - Math.floor(n);
}

function renderNightDrive(now){
  const t = now / 1000;
  const w = W, h = H;
  const roadY = h * 0.72;

  const sky = ctx.createLinearGradient(0, 0, 0, roadY);
  sky.addColorStop(0, '#050a18');
  sky.addColorStop(0.45, '#0f0a28');
  sky.addColorStop(0.8, '#1a0a2a');
  sky.addColorStop(1, '#0a0818');
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, w, roadY);

  for(let i=0;i<100;i++){
    const sx = seededRand(i, 7) * w;
    const sy = seededRand(i, 13) * roadY * 0.75;
    const twinkle = 0.4 + 0.6 * Math.abs(Math.sin(t * 1.5 + i * 1.7));
    ctx.globalAlpha = 0.25 + twinkle * 0.6;
    ctx.fillStyle = i % 8 === 0 ? '#a8c8ff' : '#ffffff';
    const sz = i % 12 === 0 ? 2 : 1.2;
    ctx.fillRect(sx, sy, sz, sz);
  }
  ctx.globalAlpha = 1;

  const moonX = w * 0.8, moonY = roadY * 0.25;
  const moonR = Math.min(w, h) * 0.045;
  const moonGlow = ctx.createRadialGradient(moonX, moonY, 0, moonX, moonY, moonR * 6);
  moonGlow.addColorStop(0, 'rgba(200,220,255,0.35)');
  moonGlow.addColorStop(0.3, 'rgba(180,200,255,0.12)');
  moonGlow.addColorStop(1, 'rgba(180,200,255,0)');
  ctx.fillStyle = moonGlow;
  ctx.fillRect(0, 0, w, roadY);

  ctx.fillStyle = '#e8ecf5';
  ctx.beginPath();
  ctx.arc(moonX, moonY, moonR, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = 'rgba(180,190,210,0.5)';
  ctx.beginPath(); ctx.arc(moonX - moonR*0.3, moonY - moonR*0.2, moonR*0.18, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(moonX + moonR*0.25, moonY + moonR*0.15, moonR*0.13, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(moonX - moonR*0.05, moonY + moonR*0.35, moonR*0.1, 0, Math.PI*2); ctx.fill();

  const farScroll = (t * 15) % 200;
  ctx.fillStyle = '#0d1020';
  for(let i=-1;i<w/200+2;i++){
    const bx = i * 200 - farScroll;
    const bh = 40 + seededRand(i, 3) * 80;
    ctx.beginPath();
    ctx.moveTo(bx, roadY);
    ctx.lineTo(bx + 60, roadY - bh);
    ctx.lineTo(bx + 140, roadY - bh * 0.7);
    ctx.lineTo(bx + 200, roadY);
    ctx.closePath();
    ctx.fill();
  }

  const midScroll = (t * 55) % 160;
  for(let i=-1;i<w/160+2;i++){
    const bx = i * 160 - midScroll;
    const bh = 60 + seededRand(i, 11) * 120;
    const bw = 100;
    ctx.fillStyle = '#151a2e';
    ctx.fillRect(bx, roadY - bh, bw, bh);
    for(let wy = 12; wy < bh - 8; wy += 14){
      for(let wx = 8; wx < bw - 8; wx += 12){
        const lit = seededRand(bx + wx, wy + Math.floor(t * 0.1)) > 0.55;
        if(lit){
          const glow = 0.5 + 0.5 * Math.sin(t * 3 + wx + wy);
          ctx.fillStyle = `rgba(255,220,140,${0.4 + glow*0.5})`;
          ctx.fillRect(bx + wx, roadY - bh + wy, 5, 7);
        }
      }
    }
  }

  const nearScroll = (t * 180) % 240;
  for(let i=-1;i<w/240+2;i++){
    const bx = i * 240 - nearScroll;
    const bh = 100 + seededRand(i, 23) * 160;
    const bw = 180;
    ctx.fillStyle = '#08090f';
    ctx.fillRect(bx, roadY - bh, bw, bh);
    for(let wy = 20; wy < bh - 20; wy += 22){
      for(let wx = 14; wx < bw - 14; wx += 18){
        const lit = seededRand(bx * 2 + wx, wy) > 0.8;
        if(lit){
          ctx.fillStyle = 'rgba(150,200,255,0.85)';
          ctx.fillRect(bx + wx, roadY - bh + wy, 6, 9);
        }
      }
    }
    ctx.fillStyle = '#08090f';
    ctx.fillRect(bx + bw*0.5 - 2, roadY - bh - 25, 4, 25);
    ctx.fillStyle = 'rgba(255,80,80,0.9)';
    ctx.beginPath();
    ctx.arc(bx + bw*0.5, roadY - bh - 27, 2.5, 0, Math.PI*2);
    ctx.fill();
  }

  const roadGrad = ctx.createLinearGradient(0, roadY, 0, h);
  roadGrad.addColorStop(0, '#0a0a14');
  roadGrad.addColorStop(1, '#050810');
  ctx.fillStyle = roadGrad;
  ctx.fillRect(0, roadY, w, h - roadY);

  const horizonGrad = ctx.createLinearGradient(0, roadY - 20, 0, roadY + 30);
  horizonGrad.addColorStop(0, 'rgba(120,180,255,0)');
  horizonGrad.addColorStop(0.5, 'rgba(120,180,255,0.25)');
  horizonGrad.addColorStop(1, 'rgba(120,180,255,0)');
  ctx.fillStyle = horizonGrad;
  ctx.fillRect(0, roadY - 20, w, 50);

  ctx.strokeStyle = 'rgba(120,180,255,0.3)';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(0, roadY);
  ctx.lineTo(w, roadY);
  ctx.stroke();

  const dashSpeed = t * 500;
  const dashOff = dashSpeed % 160;
  ctx.fillStyle = 'rgba(255,255,200,0.75)';
  for(let x = -dashOff; x < w; x += 160){
    ctx.fillRect(x, roadY + 100, 80, 6);
  }

  ctx.fillStyle = 'rgba(80,110,150,0.4)';
  ctx.fillRect(0, h - 60, w, 2);

  const lampSpacing = 340;
  const lampScroll = (t * 500) % lampSpacing;
  for(let i=-1;i<w/lampSpacing+2;i++){
    const lx = i * lampSpacing - lampScroll;
    const lampX = lx + 60;
    const lampTopY = roadY - 140;

    ctx.strokeStyle = '#1a1f2e';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(lampX, roadY + 20);
    ctx.lineTo(lampX, lampTopY);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(lampX, lampTopY);
    ctx.quadraticCurveTo(lampX + 20, lampTopY - 10, lampX + 40, lampTopY + 5);
    ctx.stroke();

    const lamp = ctx.createRadialGradient(lampX + 40, lampTopY + 5, 0, lampX + 40, lampTopY + 5, 80);
    lamp.addColorStop(0, 'rgba(255,220,150,0.85)');
    lamp.addColorStop(0.4, 'rgba(255,200,100,0.25)');
    lamp.addColorStop(1, 'rgba(255,200,100,0)');
    ctx.fillStyle = lamp;
    ctx.beginPath();
    ctx.arc(lampX + 40, lampTopY + 5, 80, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#fff8d0';
    ctx.shadowColor = '#ffe8a0';
    ctx.shadowBlur = 24;
    ctx.beginPath();
    ctx.ellipse(lampX + 40, lampTopY + 5, 10, 6, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  const carW = Math.min(w * 0.38, 480);
  const carH = carW * 0.4;
  const carCX = w * 0.5;
  const carCY = roadY + 70;
  const bounce = Math.sin(t * 8) * 1.5;

  drawNightCar(carCX, carCY + bounce, carW, carH, t);

  for(let i=0;i<25;i++){
    const lx = ((i * 137.5 + t * 800) % (w + 400)) - 200;
    const ly = roadY + 50 + (i * 23) % (h - roadY - 60);
    const len = 30 + (i % 4) * 25;
    ctx.globalAlpha = 0.15 + (i % 5) * 0.06;
    ctx.strokeStyle = i % 3 === 0 ? '#a8c8ff' : '#ffffff';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(lx, ly);
    ctx.lineTo(lx + len, ly);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;

  const underGlow = ctx.createRadialGradient(carCX, carCY + carH * 0.4, 0, carCX, carCY + carH * 0.4, carW * 0.9);
  underGlow.addColorStop(0, 'rgba(255,220,150,0.18)');
  underGlow.addColorStop(1, 'rgba(255,220,150,0)');
  ctx.fillStyle = underGlow;
  ctx.fillRect(0, carCY, w, h - carCY);
}

function drawNightCar(x, y, carW, carH, t){
  ctx.save();
  ctx.translate(x, y);

  ctx.fillStyle = 'rgba(0,0,0,0.65)';
  ctx.beginPath();
  ctx.ellipse(0, carH * 0.85, carW * 0.55, carH * 0.12, 0, 0, Math.PI * 2);
  ctx.fill();

  const body = new Path2D();
  body.moveTo(-carW * 0.5, 0);
  body.lineTo(-carW * 0.5, -carH * 0.35);
  body.quadraticCurveTo(-carW * 0.5, -carH * 0.5, -carW * 0.42, -carH * 0.55);
  body.lineTo(-carW * 0.18, -carH * 0.57);
  body.lineTo(-carW * 0.08, -carH * 0.9);
  body.quadraticCurveTo(-carW * 0.02, -carH * 0.95, carW * 0.05, -carH * 0.95);
  body.lineTo(carW * 0.18, -carH * 0.95);
  body.quadraticCurveTo(carW * 0.22, -carH * 0.95, carW * 0.26, -carH * 0.88);
  body.lineTo(carW * 0.34, -carH * 0.55);
  body.lineTo(carW * 0.48, -carH * 0.5);
  body.quadraticCurveTo(carW * 0.5, -carH * 0.48, carW * 0.5, -carH * 0.35);
  body.lineTo(carW * 0.5, 0);
  body.closePath();

  const bodyGrad = ctx.createLinearGradient(0, -carH * 0.9, 0, 0);
  bodyGrad.addColorStop(0, '#2a3550');
  bodyGrad.addColorStop(0.4, '#1a2238');
  bodyGrad.addColorStop(1, '#0a0e1a');
  ctx.fillStyle = bodyGrad;
  ctx.fill(body);

  ctx.strokeStyle = 'rgba(150,200,255,0.5)';
  ctx.lineWidth = 2;
  ctx.stroke(body);

  ctx.fillStyle = 'rgba(70,140,200,0.5)';
  ctx.beginPath();
  ctx.moveTo(-carW * 0.05, -carH * 0.57);
  ctx.lineTo(-carW * 0.03, -carH * 0.88);
  ctx.lineTo(carW * 0.17, -carH * 0.88);
  ctx.lineTo(carW * 0.23, -carH * 0.57);
  ctx.closePath();
  ctx.fill();

  const windshield = ctx.createLinearGradient(0, -carH * 0.88, 0, -carH * 0.57);
  windshield.addColorStop(0, 'rgba(180,220,255,0.4)');
  windshield.addColorStop(1, 'rgba(180,220,255,0)');
  ctx.fillStyle = windshield;
  ctx.beginPath();
  ctx.moveTo(-carW * 0.05, -carH * 0.57);
  ctx.lineTo(-carW * 0.03, -carH * 0.88);
  ctx.lineTo(carW * 0.17, -carH * 0.88);
  ctx.lineTo(carW * 0.23, -carH * 0.57);
  ctx.closePath();
  ctx.fill();

  const beamGrad = ctx.createLinearGradient(carW * 0.45, -carH * 0.25, carW * 2, -carH * 0.1);
  beamGrad.addColorStop(0, 'rgba(255,240,180,0.5)');
  beamGrad.addColorStop(0.5, 'rgba(255,240,180,0.15)');
  beamGrad.addColorStop(1, 'rgba(255,240,180,0)');
  ctx.fillStyle = beamGrad;
  ctx.beginPath();
  ctx.moveTo(carW * 0.46, -carH * 0.32);
  ctx.lineTo(carW * 1.9, -carH * 0.45);
  ctx.lineTo(carW * 1.9, carH * 0.15);
  ctx.lineTo(carW * 0.46, -carH * 0.05);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle = '#fff8d0';
  ctx.shadowColor = '#fff8d0';
  ctx.shadowBlur = 28;
  ctx.beginPath();
  ctx.ellipse(carW * 0.46, -carH * 0.22, carW * 0.025, carH * 0.06, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;

  ctx.fillStyle = '#ff3030';
  ctx.shadowColor = '#ff3030';
  ctx.shadowBlur = 20;
  ctx.beginPath();
  ctx.ellipse(-carW * 0.47, -carH * 0.25, carW * 0.022, carH * 0.055, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;

  const wheelR = carH * 0.19;
  const wheelRot = t * 12;
  for(const wx of [-carW * 0.3, carW * 0.32]){
    ctx.save();
    ctx.translate(wx, 0);
    const tg = ctx.createRadialGradient(-wheelR*0.3, -wheelR*0.3, wheelR*0.2, 0, 0, wheelR);
    tg.addColorStop(0, '#1a1d22');
    tg.addColorStop(1, '#050608');
    ctx.beginPath();
    ctx.arc(0, 0, wheelR, 0, Math.PI * 2);
    ctx.fillStyle = tg;
    ctx.fill();

    ctx.save();
    ctx.rotate(wheelRot);
    ctx.beginPath();
    ctx.arc(0, 0, wheelR * 0.62, 0, Math.PI * 2);
    ctx.fillStyle = '#8b95a5';
    ctx.fill();
    ctx.fillStyle = 'rgba(60,68,80,0.95)';
    for(let s=0;s<5;s++){
      ctx.save();
      ctx.rotate(s * Math.PI * 2 / 5);
      ctx.beginPath();
      ctx.roundRect(-wheelR * 0.07, -wheelR * 0.56, wheelR * 0.14, wheelR * 0.42, wheelR * 0.04);
      ctx.fill();
      ctx.restore();
    }
    ctx.beginPath();
    ctx.arc(0, 0, wheelR * 0.19, 0, Math.PI * 2);
    ctx.fillStyle = '#3a4250';
    ctx.fill();
    ctx.restore();
    ctx.restore();
  }

  const roadGlow = ctx.createRadialGradient(carW * 0.9, carH * 0.5, 0, carW * 0.9, carH * 0.5, carW * 0.6);
  roadGlow.addColorStop(0, 'rgba(255,230,150,0.25)');
  roadGlow.addColorStop(1, 'rgba(255,230,150,0)');
  ctx.fillStyle = roadGlow;
  ctx.beginPath();
  ctx.ellipse(carW * 0.9, carH * 0.5, carW * 0.6, carH * 0.15, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}

/* ═══════════════════════════════════════════════════════════
   ДИСПЕТЧЕР РЕНДЕРА
═══════════════════════════════════════════════════════════ */
const stageRenderers = [
  stageDesign, stageStamping, stageWelding, stagePainting,
  stageEngine, stageAssembly, stageQC, stageFinal
];

let lastNow = 0;

function frame(now){
  if(!lastNow) lastNow = now;
  let dt = (now - lastNow) / 1000;
  lastNow = now;
  dt = clamp(dt, 0, 0.05);

  if(displayAnim !== targetAnim){
    fadeAlpha -= 0.06;
    if(fadeAlpha <= 0){
      fadeAlpha = 0;
      displayAnim = targetAnim;
    }
  } else if(fadeAlpha < 1){
    fadeAlpha = Math.min(1, fadeAlpha + 0.06);
  }

  ctx.clearRect(0, 0, W, H);

  if(displayAnim === 0){
    let t = (now / 1000 + timeOffset) % TOTAL;
    if(t < 0) t += TOTAL;
    const idx = stageIndexAt(t);
    const st = stages[idx];
    const local = t - st.start;
    const p = clamp(local / st.dur, 0, 1);

    updateUI(t);
    updateParticles(dt);
    drawBackground(t, st.accent);

    const fadeIn = clamp(local / 0.9, 0, 1);
    const fadeOut = clamp((st.dur - local) / 0.7, 0, 1);
    const sceneAlpha = Math.min(fadeIn, fadeOut);

    ctx.save();
    ctx.globalAlpha = sceneAlpha * fadeAlpha;
    stageRenderers[idx](local, p);
    ctx.restore();
  } else {
    updateUI(0);
    ctx.save();
    ctx.globalAlpha = fadeAlpha;
    renderNightDrive(now);
    ctx.restore();
  }

  requestAnimationFrame(frame);
}

requestAnimationFrame(frame);

/* ═══════════════════════════════════════════════════════════
   PRESENCE SYSTEM — РЕАЛЬНЫЕ ПОЛЬЗОВАТЕЛИ
═══════════════════════════════════════════════════════════ */
const PresenceSystem = (() => {
  const defaultProfile = {
    name: 'Гость_' + Math.random().toString(36).substr(2, 4).toUpperCase(),
    city: 'Москва',
    color: ['#4fc3ff','#7ee787','#fbbf24','#c084fc','#f472b6','#22d3ee',
            '#fb923c','#a78bfa','#38bdf8','#f87171','#34d399','#f59e0b'][
      Math.floor(Math.random() * 12)
    ],
    joinedAt: Date.now()
  };

  let profile = { ...defaultProfile };
  try {
    const saved = JSON.parse(localStorage.getItem('car_creator_profile') || '{}');
    if(saved.name) profile.name = saved.name;
    if(saved.city) profile.city = saved.city;
    if(saved.color) profile.color = saved.color;
  } catch(e) {}

  function saveProfile(){
    try {
      localStorage.setItem('car_creator_profile', JSON.stringify({
        name: profile.name, city: profile.city, color: profile.color
      }));
    } catch(e) {}
  }

  const state = {
    myId: 'u_' + Math.random().toString(36).substr(2, 9),
    yjsUsers: new Map(),
    bcUsers: new Map(),
    connectionStatus: 'connecting',
    ydoc: null,
    provider: null,
    awareness: null,
    bc: null
  };

  let renderScheduled = false;
  function scheduleRender(){
    if(renderScheduled) return;
    renderScheduled = true;
    requestAnimationFrame(() => {
      renderScheduled = false;
      render();
    });
  }

  function getAllUsers(){
    const users = [];
    const seen = new Set();

    state.yjsUsers.forEach((u, id) => {
      if(!seen.has(id)){
        seen.add(id);
        users.push({
          id, name: u.name, city: u.city, color: u.color,
          joinedAt: u.joinedAt, isMe: id === state.myId, source: 'yjs'
        });
      }
    });

    if(!state.yjsUsers.has(state.myId)){
      users.push({
        id: state.myId, name: profile.name, city: profile.city,
        color: profile.color, joinedAt: profile.joinedAt,
        isMe: true, source: 'self'
      });
    }

    state.bcUsers.forEach((u, id) => {
      if(!seen.has(id)){
        seen.add(id);
        users.push({
          id, name: u.name, city: u.city, color: u.color,
          joinedAt: u.joinedAt, isMe: false, source: 'bc'
        });
      }
    });

    return users;
  }

  function timeAgo(ts){
    const diff = Math.floor((Date.now() - ts) / 1000);
    if(diff < 10) return 'только что';
    if(diff < 60) return diff + ' сек назад';
    if(diff < 3600) return Math.floor(diff / 60) + ' мин назад';
    if(diff < 86400) return Math.floor(diff / 3600) + ' ч назад';
    return Math.floor(diff / 86400) + ' дн назад';
  }

  function render(){
    const users = getAllUsers();
    const total = users.length;

    const countEl = document.getElementById('presenceCount');
    const totalEl = document.getElementById('presenceTotalText');
    if(countEl && countEl.textContent !== String(total)){
      countEl.textContent = total;
      countEl.classList.remove('bump');
      void countEl.offsetWidth;
      countEl.classList.add('bump');
    }
    if(totalEl) totalEl.textContent = total;

    const liveEl = document.getElementById('presenceLive');
    if(liveEl){
      liveEl.classList.remove('offline', 'connecting');
      if(state.connectionStatus === 'bc-only') liveEl.classList.add('offline');
      else if(state.connectionStatus === 'connecting') liveEl.classList.add('connecting');
    }

    const statusEl = document.getElementById('profileStatus');
    if(statusEl){
      if(state.connectionStatus === 'connected'){
        statusEl.textContent = 'В сети';
        statusEl.style.color = '#22c55e';
      } else if(state.connectionStatus === 'bc-only'){
        statusEl.textContent = 'Только вкладки';
        statusEl.style.color = '#f59e0b';
      } else {
        statusEl.textContent = 'Подключение…';
        statusEl.style.color = '#6b7280';
      }
    }

    const avatarsEl = document.getElementById('presenceAvatars');
    if(avatarsEl){
      avatarsEl.innerHTML = '';
      const sorted = users.slice().sort((a,b) => (b.isMe?1:0) - (a.isMe?1:0));
      const show = sorted.slice(0, 4);
      const overflow = sorted.length - show.length;

      show.forEach(u => {
        const av = document.createElement('div');
        av.className = 'presence-avatar';
        av.style.background = u.color;
        av.textContent = u.name.charAt(0).toUpperCase();
        av.title = u.name + (u.isMe ? ' (вы)' : '');
        avatarsEl.appendChild(av);
      });
      if(overflow > 0){
        const more = document.createElement('div');
        more.className = 'presence-avatar presence-avatar-more';
        more.textContent = '+' + overflow;
        avatarsEl.appendChild(more);
      }
    }

    const listEl = document.getElementById('presenceList');
    if(listEl){
      listEl.innerHTML = '';
      if(users.length === 0){
        const empty = document.createElement('div');
        empty.style.cssText = 'padding:20px;text-align:center;color:rgba(255,255,255,.4);font-size:12px;';
        empty.textContent = 'Никого нет';
        listEl.appendChild(empty);
      }
      const sorted = users.slice().sort((a,b) => {
        if(a.isMe !== b.isMe) return a.isMe ? -1 : 1;
        return b.joinedAt - a.joinedAt;
      });
      sorted.forEach(u => {
        const item = document.createElement('div');
        item.className = 'presence-item';

        const av = document.createElement('div');
        av.className = 'presence-item-avatar';
        av.style.background = u.color;
        av.textContent = u.name.charAt(0).toUpperCase();

        const info = document.createElement('div');
        info.className = 'presence-item-info';

        const nameRow = document.createElement('div');
        nameRow.className = 'presence-item-name';
        nameRow.textContent = u.name;

        if(u.isMe){
          const badge = document.createElement('span');
          badge.className = 'presence-item-badge';
          badge.textContent = 'ВЫ';
          nameRow.appendChild(badge);
        } else if(u.source === 'bc'){
          const badge = document.createElement('span');
          badge.className = 'presence-item-badge tab';
          badge.textContent = 'ВКЛАДКА';
          nameRow.appendChild(badge);
        } else if(u.source === 'yjs'){
          const badge = document.createElement('span');
          badge.className = 'presence-item-badge net';
          badge.textContent = 'СЕТЬ';
          nameRow.appendChild(badge);
        }

        const status = document.createElement('div');
        status.className = 'presence-item-status';
        status.textContent = (u.city || '—') + ' · ' + timeAgo(u.joinedAt);

        info.appendChild(nameRow);
        info.appendChild(status);

        const dot = document.createElement('div');
        dot.className = 'presence-item-dot';

        item.appendChild(av);
        item.appendChild(info);
        item.appendChild(dot);
        listEl.appendChild(item);
      });
    }

    const nameInput = document.getElementById('profileName');
    const cityInput = document.getElementById('profileCity');
    if(nameInput && document.activeElement !== nameInput){
      nameInput.value = profile.name;
    }
    if(cityInput && document.activeElement !== cityInput){
      cityInput.value = profile.city;
    }
  }

  async function connectYjs(){
    try {
      const Y = await import('https://esm.sh/yjs@13.6.0');
      const { WebsocketProvider } = await import('https://esm.sh/y-websocket@1.5.4');

      state.ydoc = new Y.Doc();
      state.provider = new WebsocketProvider(
        'wss://demos.yjs.dev',
        'car_creator_presence_v1',
        state.ydoc,
        { connect: true }
      );
      state.awareness = state.provider.awareness;

      state.awareness.setLocalStateField('user', {
        name: profile.name,
        city: profile.city,
        color: profile.color,
        joinedAt: profile.joinedAt
      });

      const updateFromAwareness = () => {
        const states = state.awareness.getStates();
        state.yjsUsers.clear();
        states.forEach((st, clientId) => {
          if(st.user){
            state.yjsUsers.set('y_' + clientId, {
              clientId,
              name: st.user.name || 'Гость',
              city: st.user.city || '—',
              color: st.user.color || '#4fc3ff',
              joinedAt: st.user.joinedAt || Date.now()
            });
          }
        });
        const myClientId = state.awareness.clientID;
        if(state.yjsUsers.has('y_' + myClientId)){
          const me = state.yjsUsers.get('y_' + myClientId);
          state.yjsUsers.delete('y_' + myClientId);
          state.yjsUsers.set(state.myId, me);
        }
        scheduleRender();
      };

      state.awareness.on('change', updateFromAwareness);
      state.provider.on('status', ({status}) => {
        if(status === 'connected'){
          state.connectionStatus = 'connected';
          scheduleRender();
        } else if(status === 'disconnected'){
          if(state.bc && state.bcUsers.size > 0){
            state.connectionStatus = 'bc-only';
          } else {
            state.connectionStatus = 'connecting';
          }
          scheduleRender();
        }
      });

      updateFromAwareness();
      state.connectionStatus = 'connected';
      scheduleRender();
    } catch(err){
      console.warn('[Presence] Yjs недоступен:', err);
      state.connectionStatus = 'bc-only';
      scheduleRender();
    }
  }

  function connectBroadcastChannel(){
    try {
      state.bc = new BroadcastChannel('car_creator_presence_bc_v1');

      const announce = () => {
        state.bc.postMessage({
          type: 'hello',
          id: state.myId,
          name: profile.name,
          city: profile.city,
          color: profile.color,
          joinedAt: profile.joinedAt
        });
      };

      state.bc.onmessage = (e) => {
        const msg = e.data;
        if(!msg || msg.id === state.myId) return;

        if(msg.type === 'hello' || msg.type === 'heartbeat'){
          const isNew = !state.bcUsers.has(msg.id);
          state.bcUsers.set(msg.id, {
            name: msg.name,
            city: msg.city,
            color: msg.color,
            joinedAt: msg.joinedAt,
            lastSeen: Date.now()
          });
          if(msg.type === 'hello') announce();
          if(isNew) scheduleRender();
        } else if(msg.type === 'bye'){
          if(state.bcUsers.delete(msg.id)) scheduleRender();
        } else if(msg.type === 'profile-update'){
          const u = state.bcUsers.get(msg.id);
          if(u){
            u.name = msg.name;
            u.city = msg.city;
            u.lastSeen = Date.now();
            scheduleRender();
          }
        }
      };

      announce();

      setInterval(() => {
        if(state.bc){
          state.bc.postMessage({
            type: 'heartbeat',
            id: state.myId,
            name: profile.name,
            city: profile.city,
            color: profile.color,
            joinedAt: profile.joinedAt
          });
        }
        const now = Date.now();
        let changed = false;
        state.bcUsers.forEach((u, id) => {
          if(now - u.lastSeen > 12000){
            state.bcUsers.delete(id);
            changed = true;
          }
        });
        if(changed) scheduleRender();
      }, 3000);

      window.addEventListener('beforeunload', () => {
        try {
          state.bc.postMessage({ type: 'bye', id: state.myId });
        } catch(e) {}
      });
    } catch(e){
      state.connectionStatus = 'offline';
    }
  }

  function updateProfile(newName, newCity){
    if(newName && newName.trim()){
      profile.name = newName.trim().substring(0, 20);
    }
    if(newCity && newCity.trim()){
      profile.city = newCity.trim().substring(0, 20);
    }
    saveProfile();

    if(state.awareness){
      state.awareness.setLocalStateField('user', {
        name: profile.name,
        city: profile.city,
        color: profile.color,
        joinedAt: profile.joinedAt
      });
    }

    if(state.bc){
      state.bc.postMessage({
        type: 'profile-update',
        id: state.myId,
        name: profile.name,
        city: profile.city
      });
    }

    scheduleRender();
  }

  function setupUI(){
    const badge = document.getElementById('presenceBadge');
    const dropdown = document.getElementById('presenceDropdown');
    if(!badge || !dropdown) return;

    let pinned = false;
    let hoverTimer = null;

    function open(){
      clearTimeout(hoverTimer);
      dropdown.classList.add('open');
      badge.classList.add('open');
    }
    function close(){
      if(pinned) return;
      dropdown.classList.remove('open');
      badge.classList.remove('open');
    }

    badge.addEventListener('mouseenter', open);
    badge.addEventListener('mouseleave', () => {
      hoverTimer = setTimeout(close, 250);
    });
    dropdown.addEventListener('mouseenter', () => clearTimeout(hoverTimer));
    dropdown.addEventListener('mouseleave', () => {
      hoverTimer = setTimeout(close, 250);
    });

    badge.addEventListener('click', (e) => {
      if(dropdown.contains(e.target)) return;
      e.stopPropagation();
      pinned = !pinned;
      if(pinned) open();
      else { dropdown.classList.remove('open'); badge.classList.remove('open'); }
    });

    document.addEventListener('click', (e) => {
      if(!badge.contains(e.target)){
        pinned = false;
        dropdown.classList.remove('open');
        badge.classList.remove('open');
      }
    });

    document.addEventListener('keydown', (e) => {
      if(e.key === 'Escape' && pinned){
        pinned = false;
        dropdown.classList.remove('open');
        badge.classList.remove('open');
      }
    });

    const nameInput = document.getElementById('profileName');
    const cityInput = document.getElementById('profileCity');

    let saveTimer = null;
    function scheduleSave(){
      clearTimeout(saveTimer);
      saveTimer = setTimeout(() => {
        updateProfile(nameInput.value, cityInput.value);
      }, 500);
    }

    if(nameInput){
      nameInput.addEventListener('input', scheduleSave);
      nameInput.addEventListener('blur', () => {
        clearTimeout(saveTimer);
        updateProfile(nameInput.value, cityInput ? cityInput.value : profile.city);
      });
    }
    if(cityInput){
      cityInput.addEventListener('input', scheduleSave);
      cityInput.addEventListener('blur', () => {
        clearTimeout(saveTimer);
        updateProfile(nameInput ? nameInput.value : profile.name, cityInput.value);
      });
    }
  }

  function init(){
    setupUI();
    connectBroadcastChannel();
    connectYjs();
    render();
    setInterval(render, 20000);
  }

  return { init, updateProfile };
})();

document.addEventListener('DOMContentLoaded', () => {
  PresenceSystem.init();
});
</script>
